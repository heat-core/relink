name: Device compatibility report
description: Describe how ReLink works on your phones.
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Share hardware observations with identifiers, messages and raw logs removed. Mark each audio direction independently.
  - type: input
    id: android
    attributes:
      label: Android phone (model, Android version, vendor skin)
      placeholder: "Google Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client device and version
      placeholder: "iPhone 13, iOS 17.5 / iPad / second Android phone"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReLink version or commit
    validations:
      required: true
  - type: dropdown
    id: sims
    attributes:
      label: SIMs
      options: ["One SIM", "Two SIMs", "eSIM + SIM"]
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Pairing and link
        - label: Incoming calls ring
        - label: Outgoing calls
        - label: Call audio, far end heard on the client
        - label: Call audio, client's microphone heard by the far end
        - label: Phone's own earpiece / microphone silent during a bridged call
        - label: Messages (sync, send, read state)
        - label: Contacts and Recents
        - label: Link switches (mobile data, hotspot, Bluetooth tethering, airplane mode)
        - label: Notifications
  - type: textarea
    id: selftest
    attributes:
      label: Call-audio self-test result
      description: Summarize the direction-specific result and remove personal data before posting.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes and problem reports
      description: "Anything odd. Attach the problem report (Tether › Help › Send a problem report on the Android phone, and Link › Send a problem report on the iPhone), made right after a test call: drag the .txt files here."
