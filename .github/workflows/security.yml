name: Security and Supply Chain

# Uses SHA-pinned Actions, verified official binary checksums, and MIT CLI scanners
# (no paid Gitleaks org license or unapproved GitHub Advanced Security billing required).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          warn-only: false

  supply-chain-hygiene:
    name: Wrapper checksums, Gitleaks, ShellCheck, actionlint and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gradle wrapper JAR checksums
        run: |
          echo "ad16bca46cb71bb5887c546860d93992aeee35c1fdaf4a242b0a612375d937e0  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  examples/kotlin-jvm/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Privacy, Python syntax, and architecture check
        run: |
          bash tools/check-private.sh --all
          python3 -m compileall -q tools
          python3 tools/check-architecture.py

      - name: Run ShellCheck on POSIX/Bash scripts and actionlint on workflows
        run: |
          for f in tools/*.sh; do
            case "$(head -n 1 "$f")" in
              *"/zsh"*) echo "Skipping zsh script (unsupported by ShellCheck): $f" ;;
              *"sh"*) shellcheck -x -S warning "$f" ;;
              *) shellcheck -s sh -S warning "$f" ;;
            esac
          done
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Run MIT Gitleaks scan with repository allowlist
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --no-banner
