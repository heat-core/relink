name: Beta release builds
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild from main
        type: string
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TETHER_MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - id: source
        env:
          BUILD_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 tools/check-protocol.py
          if [[ -n "$BUILD_TAG" ]]; then
            test "$BUILD_TAG" = "v$(cat VERSION)"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Android tests, lint and unsigned APK
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_COMMIT: ${{ needs.contract.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.contract.outputs.commit }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: SDK platform and build tools
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            manager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -x "$manager"
            "$manager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Run Android tests, release lint and build
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --console=plain "-Ptether.commit=$RELEASE_COMMIT" :core:test :app:testDebugUnitTest :helper:testDebugUnitTest :client:testDebugUnitTest \
            :app:lintRelease :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Verify and record unsigned APK
        run: |
          mkdir -p dist
          apk=dist/relink-android-unsigned.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/android-manifest.txt"
          grep -F "package: name='app.relink.android'" "$RUNNER_TEMP/android-manifest.txt"
          grep -F "versionName='$(cut -d- -f1 VERSION)'" "$RUNNER_TEMP/android-manifest.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/android-manifest.txt"; then exit 1; fi
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/android-components.txt"
          if grep -Eq 'WRITE_SECURE_SETTINGS|DebugReceiver|TestConnectionService|PipeProbeProvider' "$RUNNER_TEMP/android-components.txt"; then exit 1; fi
          if "$tools/apksigner" verify "$apk"; then
            echo 'Expected owner-signable unsigned APK'; exit 1
          fi
          printf 'release=%s\ncommit=%s\n' "$(cat VERSION)" "$RELEASE_COMMIT" > dist/android-build.txt
          (cd dist && sha256sum relink-android-unsigned.apk > android-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-validation
          path: |
            ${{ runner.temp }}/android-*.log
            ${{ runner.temp }}/android-*.txt
            android/*/build/test-results/**/*.xml
            android/*/build/reports/*lint*.xml
          retention-days: 7

  ios:
    name: Swift tests and full Xcode build
    needs: contract
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_COMMIT: ${{ needs.contract.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.contract.outputs.commit }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
            ios/TetherCore/.build/repositories
          key: macos-26-xcode-26.6-swiftpm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
      - name: Swift Core tests
        run: |
          set -o pipefail
          xcodebuild -version
          swift test --package-path ios/TetherCore 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"
      - name: Resolve pinned Xcode packages
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tether.xcodeproj -scheme Tether -onlyUsePackageVersionsFromResolvedFile \
            -resolvePackageDependencies 2>&1 | tee "$RUNNER_TEMP/xcode-resolve.log"
      - name: Full unsigned Xcode build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Tether.xcodeproj -scheme Tether -onlyUsePackageVersionsFromResolvedFile \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build-release \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            TETHER_ENTITLEMENTS= TETHER_COMM_NOTIFICATIONS=NO "TETHER_GIT_COMMIT=$RELEASE_COMMIT" \
            build 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"
      - name: Simulator tests when an iOS runtime is installed
        working-directory: ios
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next((d["udid"] for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime
                      for d in devices[runtime] if d["name"].startswith("iPhone") and d.get("isAvailable")), ""))
          ')
          if [ -z "$udid" ]; then
            echo 'iOS Simulator tests skipped: no available iPhone runtime.' | tee "$RUNNER_TEMP/xcode-tests.log"
          else
            xcodebuild -project Tether.xcodeproj -scheme Tether -onlyUsePackageVersionsFromResolvedFile \
              -destination "id=$udid" -derivedDataPath build-test -parallel-testing-enabled NO \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/xcode-tests.log"
          fi
      - name: Validate app bundle and package IPA for owner re-signing
        run: |
          app=ios/build-release/Build/Products/Release-iphoneos/Tether.app
          export APP_PATH="$app"
          GITHUB_SHA="$RELEASE_COMMIT" python3 tools/check-ios-artifact.py
          mkdir -p work/Payload dist
          cp -R "$app" work/Payload/
          (cd work && zip -qry ../dist/relink-ios-unsigned.ipa Payload)
          unzip -tq dist/relink-ios-unsigned.ipa
          printf 'release=%s\ncommit=%s\n' "$(cat VERSION)" "$RELEASE_COMMIT" > dist/ios-build.txt
          (cd dist && shasum -a 256 relink-ios-unsigned.ipa > ios-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: ios-owner-resigning
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-validation
          path: |
            ${{ runner.temp }}/swift-tests.log
            ${{ runner.temp }}/xcode-*.log
          retention-days: 7
