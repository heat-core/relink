name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TETHER_MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/

jobs:
  contract:
    name: Protocol and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check-protocol.py
      - run: python3 tools/check-docs-links.py
      - name: Guardrails
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 tools/check-guardrails.py --base "$BASE_SHA"
          else
            python3 tools/check-guardrails.py
          fi
      - run: git diff --check HEAD^ HEAD
      - name: Working tree privacy
        run: bash tools/check-private.sh --all

  kotlin:
    name: Kotlin Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --console=plain -Ptether.libraryOnly=true :core:test
        working-directory: android

  swift:
    name: Swift Core tests
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift test
