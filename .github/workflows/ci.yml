name: Source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 tools/check-protocol.py
      - run: python3 tools/check-docs-links.py
      - run: python3 tools/check-guardrails.py
      - run: bash tools/check-private.sh --all
